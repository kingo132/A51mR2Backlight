name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

env:
  PROJECT_TYPE: KEXT

jobs:
  build:
    name: Build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: acidanthera/MacKernelSDK
          path: MacKernelSDK
      - name: CI bootstrap
        run: |
          src=$(/usr/bin/curl -Lfs https://raw.githubusercontent.com/acidanthera/ocbuild/master/ci-bootstrap.sh) && eval "$src" || exit 1
      - name: Plugin dependencies
        run: ./Scripts/bootstrap.sh
      - name: Verify framebuffer signatures
        run: |
          python3 Tools/verify_signatures.py \
            Reference/Framebuffers/AMDRadeonX6000Framebuffer.bigsur \
            Reference/Framebuffers/AMDRadeonX6000Framebuffer.monterey \
            --family legacy
          python3 Tools/verify_signatures.py \
            Reference/Framebuffers/AMDRadeonX6000Framebuffer.sonoma \
            Reference/Framebuffers/AMDRadeonX6000Framebuffer.sequoia.15.3 \
            Reference/Framebuffers/AMDRadeonX6000Framebuffer.tahoe \
            --family modern
      - run: xcodebuild -jobs 1 -configuration Debug
      - run: xcodebuild -jobs 1 -configuration Release
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: A51mR2Backlight
          path: build/*/*.zip
      - name: Upload release artifacts
        if: github.event_name == 'release'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/*/*.zip
          tag: ${{ github.ref }}
          file_glob: true
